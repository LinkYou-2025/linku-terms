<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원 탈퇴 | 링큐</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico?v=2">

  <style>
    :root {
      --text-main: #1d1d1f;
      --text-body: #3a3a3c;
      --text-muted: #8e8e93;
      --line-main: #e5e5ea;
      --line-soft: #f2f2f7;
    }

    * {
      box-sizing: border-box;
      overflow-wrap: break-word;
      word-break: keep-all;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #fff;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.8;
    }

    .container {
      max-width: 840px;
      margin: 0 auto;
      padding: 56px 24px 80px;
    }

    .tab-menu {
      display: flex;
      gap: 28px;
      row-gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 36px;
      font-size: 16px;
    }

    .tab-menu a {
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 500;
      position: relative;
      transition: color 0.2s ease;
      white-space: nowrap;
    }

    .tab-menu a:hover {
      color: #000;
    }

    .tab-menu a.active {
      color: #000;
    }

    .tab-menu a.active::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -6px;
      width: 100%;
      height: 1.5px;
      background: #000;
      border-radius: 2px;
    }

    .hero {
      padding: 28px 0 34px;
      margin-bottom: 44px;
      border-bottom: 1px solid var(--line-main);
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .hero-desc {
      margin-top: 16px;
      font-size: 16px;
      color: var(--text-body);
    }

    .delete-section {
      margin-top: 8px;
    }

    .delete-section h2 {
      margin: 0 0 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line-soft);
      font-size: 24px;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: -0.25px;
    }

    .delete-section p {
      margin: 0 0 16px;
      font-size: 16px;
      color: var(--text-body);
    }

    .delete-info {
      margin-top: 32px;
      padding: 24px;
      border: 1px solid var(--line-soft);
      background: #fafafa;
    }

    .delete-info p {
      margin: 0;
      font-size: 15px;
      line-height: 1.7;
    }

    .button-wrap {
      margin-top: 36px;
    }

    .delete-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 24px;
      background: #1d1d1f;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      transition: opacity 0.2s ease;
    }

    .delete-button:hover {
      opacity: 0.8;
    }

    .footer {
      margin-top: 96px;
      padding-top: 28px;
      border-top: 1px solid var(--line-main);
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .footer span {
      display: block;
      margin-top: 6px;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 40px 20px 64px;
      }

      .tab-menu {
        gap: 18px;
        margin-bottom: 28px;
        font-size: 15px;
      }

      .hero {
        padding: 20px 0 28px;
        margin-bottom: 34px;
      }

      h1 {
        font-size: 28px;
      }

      .delete-section h2 {
        font-size: 21px;
      }

      .hero-desc,
      .delete-section p {
        font-size: 15px;
      }

      .delete-info {
        padding: 20px;
      }

      .delete-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="tab-menu">
      <a href="./terms.html">이용약관</a>
      <a href="./index.html">개인정보처리방침</a>
      <a href="./marketing.html">마케팅 수신동의</a>
      <a href="./delete-account.html" class="active" aria-current="page">회원 탈퇴</a>
    </div>

    <section class="hero">
      <h1>링큐(LINK:U) 회원 탈퇴</h1>

      <p class="hero-desc">
        링큐 회원 탈퇴를 원하시는 경우 아래 버튼을 통해 계정 삭제를 신청할 수 있습니다.
      </p>
    </section>

    <section class="delete-section">

      <h2>계정 삭제 요청</h2>

      <p>
        아래 버튼을 통해 계정 삭제 요청을 제출해주세요.
      </p>

      <p>
        삭제 요청이 접수되면 본인 확인 후 계정 및 관련 데이터의 삭제 절차가 진행됩니다.
      </p>

      <div class="delete-info">
        <p>
          ※ 법령에 따라 일정 기간 보관이 필요한 정보는 해당 기간 동안 보관될 수 있습니다.
        </p>
      </div>

      <div class="button-wrap">
        <a
          href="https://docs.google.com/forms/d/e/1FAIpQLSc7L_FA9nXbbXuxz1_mY7O7l9F_f1L5I88c2dFCwWnPiCu1mw/viewform?usp=dialog"
          class="delete-button"
          target="_blank"
          rel="noopener noreferrer"
        >
          회원 탈퇴 신청
        </a>
      </div>

    </section>

    <div class="footer">
      © 2026 LinkU. All rights reserved.
      <span>Powered by LinkU</span>
    </div>

  </div>
</body>
</html>
